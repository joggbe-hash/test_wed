name: CI

on:
  push:
    branches:
      - main
      - V2-version
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - Type-WSP-deploy/shared
          - Type-WSP-deploy/api
          - Type-WSP-deploy/worker
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            Type-WSP-deploy/api/go.sum
            Type-WSP-deploy/worker/go.sum
      - run: go test ./... -count=1
      - run: go vet ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
