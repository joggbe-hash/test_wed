<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入與註冊</title>
    <style>
        :root {
            --nav-bg: #8B6E5B;   
            --content-bg: #E0D8CC; 
            --card-bg: #FFFFFF;  
            --text-dark: #333333;
            --text-gray: #7A7A7A;
            --primary-brown: #4A3320;
        }

        /* --- 基礎設定 --- */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--content-bg); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        .auth-container {
            width: 100vw;  
            height: 100vh; 
            overflow: hidden; 
        }

        .form-slider {
            display: flex;
            width: 200%;  
            height: 100%; 
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); 
            transform: translateX(0); 
        }

        .form-section {
            width: 50%;  
            height: 100%; 
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
        }

        .input-group {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            border: 1px solid #DCD6CD;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .input-label {
            background-color: var(--nav-bg);
            color: white;
            padding: 12px 20px;
            min-width: 100px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        .input-field {
            flex-grow: 1;
            border: none;
            padding: 12px 15px;
            outline: none;
            font-size: 16px;
            background-color: white;
        }

        .btn {
            background-color: var(--primary-brown);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn:hover { background-color: #331A00; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }

        .login-image-placeholder {
            width: 100%;
            max-width: 500px;
            height: 250px;
            background-color: #F4EFEA;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .shape-circle { width: 60px; height: 60px; background-color: #DCD6CD; border-radius: 50%; position: absolute; top: 40px; left: 80px; }
        .shape-triangle { width: 0; height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent; border-bottom: 120px solid #DCD6CD; position: absolute; bottom: 30px; left: 150px; }

        .forgot-password { width: 100%; max-width: 500px; text-align: right; margin-bottom: 20px; }
        .forgot-password a { color: var(--text-gray); text-decoration: none; font-size: 14px; background-color: #F4EFEA; padding: 6px 12px; border-radius: 4px; transition: all 0.2s; }
        .forgot-password a:hover { color: var(--primary-brown); background-color: #E0D8CC; }

        .login-actions { display: flex; gap: 20px; width: 100%; max-width: 500px; justify-content: space-between; }
        .login-actions .btn { flex: 1; }
        .login-actions .btn-outline { background-color: transparent; border: 2px solid var(--primary-brown); color: var(--primary-brown); box-shadow: none; }
        .login-actions .btn-outline:hover { background-color: #F4EFEA; }

        /* --- 註冊專用樣式 --- */
        #registerForm { background-color: #FAF8F5; }
        .reg-group {
            display: flex;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            align-items: center;
        }
        .reg-label {
            color: var(--primary-brown);
            width: 150px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .reg-input {
            flex-grow: 1;
            border: 1px solid #DCD6CD;
            padding: 12px 15px;
            outline: none;
            font-size: 16px;
            background-color: white;
            border-radius: 8px;
        }
        .reg-btn {
            background-color: var(--nav-bg);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .reg-btn:hover { background-color: var(--primary-brown); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }

        @media (max-width: 768px) {
            .form-section { padding: 20px; width: 100vw; }
            .login-image-placeholder { height: 180px; }
            .input-label { min-width: 80px; padding: 10px; font-size: 14px; }
            .input-field { font-size: 14px; }
            .btn { width: 100%; padding: 12px; }
            .login-actions { flex-direction: column-reverse; gap: 15px; }
            .forgot-password { text-align: center; }
            .reg-group { flex-direction: column; align-items: flex-start; }
            .reg-label { margin-bottom: 8px; }
            .reg-input { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="form-slider" id="slider">
            
            <!-- 登入表單 -->
            <div id="loginForm" class="form-section">
                <div class="login-image-placeholder">
                    <div class="shape-circle"></div>
                    <div class="shape-triangle"></div>
                </div>

                <div class="input-group">
                    <div class="input-label">帳號</div>
                    <input type="text" class="input-field" placeholder="例如: s123456789">
                </div>

                <div class="input-group">
                    <div class="input-label">密碼</div>
                    <input type="password" class="input-field" placeholder="輸入密碼">
                </div>

                <div class="forgot-password"><a href="#">忘記密碼</a></div>

                <div class="login-actions">
                    <button class="btn btn-outline" onclick="toggleForm('register')">註冊帳號</button>
                    <!-- 點擊跳轉到 first_page.html -->
                    <button class="btn" onclick="window.location.href='first_page.html'">立即登入</button>
                </div>
            </div>

            <!-- 註冊表單 -->
            <div id="registerForm" class="form-section">
                <div class="reg-group"><div class="reg-label">電子郵件</div><input type="email" class="reg-input" placeholder="example@email.com"></div>
                <div class="reg-group"><div class="reg-label">驗證碼</div><input type="text" class="reg-input" placeholder="輸入收到的驗證碼"></div>
                <div class="reg-group"><div class="reg-label">輸入密碼</div><input type="password" class="reg-input" placeholder="至少8位字元"></div>
                <div class="reg-group"><div class="reg-label">確認密碼</div><input type="password" class="reg-input" placeholder="再次輸入密碼"></div>
                <div class="reg-group"><div class="reg-label">使用者名稱</div><input type="text" class="reg-input" placeholder="例如: 王小明"></div>

                <!-- 註冊完成後返回登入畫面 -->
                <button class="reg-btn" onclick="alert('註冊成功！請登入您的帳號。'); toggleForm('login')">確認註冊</button>
                
                <div style="margin-top: 25px;">
                    <a href="#" style="color: var(--nav-bg); text-decoration: none; font-weight: 500;" onclick="toggleForm('login')">已有帳號？返回登入</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleForm(target) {
            const slider = document.getElementById('slider');
            if (target === 'register') {
                slider.style.transform = 'translateX(-50%)';
            } else {
                slider.style.transform = 'translateX(0)';
            }
        }
    </script>

</body>
</html>
