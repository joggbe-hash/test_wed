<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁/朋友</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=explore" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/intel-one-mono/index.css">

    <link rel="stylesheet" href="css/first_page.css">
</head>
<body>
    <div class="app-container">
        <div class="navbar">
            <div class="nav-logo" onclick="window.location.href='first_page.html'"></div>
            <div class="nav-actions">
                <div class="nav-square" onclick="window.location.href='explore_page.html'">
                    <span class="material-symbols-outlined">explore</span>
                </div>
                <div class="nav-icon" onclick="window.location.href='personal_page.html'"></div>
                <div class="nav-badge" onclick="window.location.href='freq_page.html'">999+</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div class="grid-icons">
                    <!-- 點擊圓點導向 introduce_page.html -->
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                    <div class="grid-icon-circle" onclick="window.location.href='introduce_page.html'"></div>
                </div>
                <div class="sidebar-card"></div>
                <div class="sidebar-card"></div>
                <div class="sidebar-card"></div>
            </div>

            <div class="feed-content">
                <!-- Post 1: Input Box -->
                <div class="post-card show" style="opacity: 1; transform: translateY(0);">
                    <div class="post-avatar" onclick="window.location.href='personal_page.html'"></div>
                    <div class="post-body">
                        <div style="font-size: 20px; font-family: 'Intel One Mono', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 500; margin-bottom: 15px; color: #4A4A4A;">@yourid</div>
                        <div style="font-size: 18px; color: #333; margin-bottom: 30px;">(打字框)</div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="display: flex; gap: 15px; color: #7A7A7A;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                <span style="font-size: 20px; font-weight: bold;">@</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 15px; color: #7A7A7A;">
                                <div id="privacy-toggle" onclick="togglePrivacy()" style="cursor: pointer; display: flex; align-items: center;">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </div>
                                <button id="privacy-btn" class="post-action-btn" style="position: static; padding: 10px 25px; background-color: #4A3320; min-width: 120px;" onclick="togglePrivacy()">公開分享</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Post 2: Text Post -->
                <div class="post-card show" style="opacity: 1; transform: translateY(0);">
                    <div class="post-avatar" onclick="window.location.href='personal_page.html'"></div>
                    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                        <div class="post-body">
                            <div style="font-size: 16px; color: #333; line-height: 1.6;">個人內容</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 6px; color: #7A7A7A;">
                            <div style="display: flex; gap: 15px;">
                                <div onclick="toggleEye(this)" style="cursor: pointer; display: flex; align-items: center;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </div>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            </div>
                            <div style="display: flex; gap: 15px;">
                                <svg onclick="toggleHeart(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                <svg onclick="toggleBookmark(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Post 3: Text Post -->
                <div class="post-card show" style="opacity: 1; transform: translateY(0);">
                    <div class="post-avatar" onclick="window.location.href='personal_page.html'"></div>
                    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                        <div class="post-body">
                            <div style="font-size: 16px; color: #333; line-height: 1.6;">發佈內容</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 6px; color: #7A7A7A;">
                            <div style="display: flex; gap: 15px;">
                                <div onclick="toggleEye(this)" style="cursor: pointer; display: flex; align-items: center;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </div>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            </div>
                            <div style="display: flex; gap: 15px;">
                                <svg onclick="toggleHeart(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                <svg onclick="toggleBookmark(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Post 4: Image Post -->
                <div class="post-card show" style="opacity: 1; transform: translateY(0);">
                    <div class="post-avatar" onclick="window.location.href='personal_page.html'"></div>
                    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                        <div class="post-body" style="padding: 20px;">
                            <div style="width: 100%; height: 350px; background-color: #CCCCCC; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; box-sizing: border-box; border-radius: 8px;">
                                <div style="background-color: #333333; border-radius: 20px; display: flex; padding: 8px 20px; gap: 20px; color: white; cursor: pointer;">
                                    <span>&lt;</span>
                                    <span>&gt;</span>
                                </div>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 6px; color: #7A7A7A;">
                            <div style="display: flex; gap: 15px;">
                                <div onclick="toggleEye(this)" style="cursor: pointer; display: flex; align-items: center;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </div>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            </div>
                            <div style="display: flex; gap: 15px;">
                                <svg onclick="toggleHeart(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                <svg onclick="toggleBookmark(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div> 
        </div> 
        <div class="fab"></div>
    </div> 
    
<script src="js/first_page.js"></script>
</body>
</html>
