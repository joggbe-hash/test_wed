<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知/好友請求</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=explore" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        :root {
            --nav-bg: #8B6E5B;   
            --content-bg: #E0D8CC; 
            --card-bg: #FFFFFF;  
            --text-dark: #333333;
            --text-gray: #7A7A7A;
            --hover-bg: #E0E0E0; 
        }

        body { margin: 0; padding: 0; background-color: var(--content-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .app-container { width: 100%; display: flex; flex-direction: column; }

        .fab { position: fixed; bottom: 40px; right: 40px; width: 80px; height: 80px; background-color: #4A3320; background-image: linear-gradient(white, white), linear-gradient(white, white); background-position: center; background-repeat: no-repeat; background-size: 40% 4px, 4px 40%; border-radius: 50%; color: transparent; font-size: 0; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.3s ease; z-index: 100; }
        .fab:hover { transform: scale(1.1) rotate(90deg); background-color: #331A00; }

        .navbar { height: 60px; flex-shrink: 0; background-color: var(--nav-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 100; }
        .nav-logo { width: 40px; height: 40px; background-color: #000; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .nav-logo:hover { transform: scale(1.05); }
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .nav-icon { width: 40px; height: 40px; background-color: var(--card-bg); border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .nav-icon:hover { transform: scale(1.05); }
        .nav-square { width: 40px; height: 40px; background-color: #4A3320; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; cursor: pointer; transition: transform 0.2s; }
        .nav-square:hover { transform: scale(1.05); }
        .nav-badge { background-color: var(--card-bg); color: #4A3320; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer; transition: transform 0.2s; }
        .nav-badge:hover { transform: scale(1.05); }

        .main-layout { display: flex; width: 100%; margin: 0; padding: 0; gap: 0; min-height: calc(100vh - 60px); }

        .sidebar { width: 380px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; position: sticky; top: 60px; align-self: flex-start; height: calc(100vh - 60px); border-right: none; background-color: var(--content-bg); padding: 40px; box-sizing: border-box; }
        
        .freq-sidebar-card { width: 100%; height: 160px; background-color: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); flex-shrink: 0; }

        .feed-content { flex: 1; display: flex; flex-direction: column; gap: 30px; padding: 40px 10%; padding-bottom: 80px; background-color: var(--content-bg); box-sizing: border-box; max-width: 1400px; margin: 0 auto; align-items: stretch; min-height: calc(100vh - 60px); }

        .freq-list-item { width: 100%; height: 80px; background-color: #D3D3D3; border-radius: 4px; flex-shrink: 0; }
        @media (max-width: 768px) {
            .navbar { padding: 0 15px; }
            .nav-actions { gap: 10px; }
            .nav-logo, .nav-icon, .nav-square { width: 32px; height: 32px; }
            .nav-badge { font-size: 12px; padding: 3px 6px; }
            
            .main-layout { flex-direction: column; }
            .sidebar { 
                width: 100%; height: auto; position: static; padding: 20px; 
                border-right: none; border-bottom: 1px solid #D0D0D0; gap: 15px;
            }
            .freq-sidebar-card { height: 100px; }
            
            .feed-content { padding: 20px; width: 100%; gap: 20px; }
            .req-card { flex-direction: column; align-items: center; text-align: center; gap: 15px; }
            .req-actions { width: 100%; justify-content: center; }
            .fab { width: 60px; height: 60px; bottom: 20px; right: 20px; font-size: 35px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="navbar">
            <div class="nav-logo" onclick="window.location.href='first_page.html'"></div>
            <div class="nav-actions">
                <div class="nav-square" onclick="window.location.href='explore_page.html'">
                    <span class="material-symbols-outlined">explore</span>
                </div>
                <div class="nav-icon" onclick="window.location.href='personal_page.html'"></div>
                <div class="nav-badge" onclick="window.location.href='freq_page.html'">999+</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <!-- Generate 3 sidebar cards -->
                <script>
                    for(let i=0; i<3; i++) {
                        document.write('<div class="freq-sidebar-card"></div>');
                    }
                </script>
            </div>

            <div class="feed-content">
                <!-- Generate 6 list items -->
                <script>
                    for(let i=0; i<6; i++) {
                        document.write('<div class="freq-list-item"></div>');
                    }
                </script>
            </div> 
        </div> 
    </div> 
</body>
</html>
