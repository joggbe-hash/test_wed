<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知/好友請求</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=explore" />
    <link rel="stylesheet" href="css/freq_page.css">
</head>
<body>
    <div class="app-container">
        <div class="navbar">
            <div class="nav-logo" onclick="window.location.href='first_page.html'"></div>
            <div class="nav-actions">
                <div class="nav-square" onclick="window.location.href='explore_page.html'">
                    <span class="material-symbols-outlined">explore</span>
                </div>
                <div class="nav-icon" onclick="window.location.href='personal_page.html'"></div>
                <div class="nav-badge" onclick="window.location.href='freq_page.html'">999+</div>
            </div>
        </div>

        <div class="main-layout">
            <!-- 左側欄：日/周/月 -->
            <div class="sidebar">
                <div class="time-card">日</div>
                <div class="time-card">周</div>
                <div class="time-card">月</div>
            </div>

            <!-- 主內容：統計項目 -->
            <div class="feed-content">
                <div class="stat-item">使用時間</div>
                <div class="stat-item">回訪次數</div>
                <div class="stat-item">瀏覽主題比例</div>
                <div class="stat-item">閱讀篇數</div>
                <div class="stat-item logout" onclick="window.location.href='index.html'">登出</div>
            </div>
        </div>
    </div>
</body>
</html>
