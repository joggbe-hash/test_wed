<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社群動態牆</title>
    <style>
        :root {
            --nav-bg: #4A4A4A;   
            --content-bg: #B3B3B3; 
            --card-bg: #FFFFFF;  
            --text-dark: #333333;
            --text-gray: #7A7A7A;
            --hover-bg: #E0E0E0; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--content-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .app-container { width: 100%; display: flex; flex-direction: column; }

        .navbar {
            height: 60px; flex-shrink: 0; background-color: var(--nav-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { width: 40px; height: 40px; background-color: #000; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .nav-logo:hover { transform: scale(1.05); }
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .logout-btn { background-color: var(--text-gray); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background-color: #555555; }
        .nav-icon { width: 40px; height: 40px; background-color: var(--card-bg); border-radius: 50%; cursor: pointer; }
        .nav-square { width: 40px; height: 40px; background-color: var(--content-bg); cursor: pointer; transition: transform 0.2s; }
        .nav-square:hover { transform: scale(1.05); }
        .nav-badge { background-color: var(--card-bg); padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer; transition: transform 0.2s; }
        .nav-badge:hover { transform: scale(1.05); }

        .main-layout { display: flex; width: 100%; margin: 0; padding: 0; gap: 0; min-height: calc(100vh - 60px); }

        .sidebar {
            width: 380px; display: flex; flex-direction: column; gap: 30px; flex-shrink: 0; position: sticky; top: 60px; align-self: flex-start; background-color: #E8E8E8; padding: 40px; box-sizing: border-box; height: calc(100vh - 60px); overflow-y: auto; border-right: 1px solid #D0D0D0;
        }

        .grid-icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .grid-icon-circle { 
            width: 100%; aspect-ratio: 1 / 1; height: auto; background-color: var(--card-bg); border-radius: 50%; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: 0;
        }
        .grid-icon-circle:hover { transform: scale(1.05); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .sidebar-card { background-color: var(--card-bg); height: 120px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease; cursor: pointer; }
        .sidebar-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        .feed-content { flex: 1; display: flex; flex-direction: column; gap: 40px; padding: 40px 10%; padding-bottom: 80px; background-color: #F0F2F5; box-sizing: border-box; max-width: 1200px; margin: 0 auto; }

        .post-card { display: flex; gap: 25px; align-items: flex-start; }
        .post-avatar { width: 90px; height: 90px; background-color: var(--card-bg); border-radius: 50%; flex-shrink: 0; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.3s ease; }
        .post-avatar:hover { transform: scale(1.05); }
        .post-body { background-color: var(--card-bg); width: 100%; border-radius: 16px; padding: 30px; box-sizing: border-box; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: box-shadow 0.3s ease; }
        .post-body:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 0.3; } 100% { opacity: 0.6; } }
        .skeleton-line { background-color: var(--text-gray); height: 20px; margin-bottom: 15px; border-radius: 10px; animation: pulse 2s infinite ease-in-out; }
        .skeleton-line.short { width: 40%; }
        .skeleton-line.long { width: 100%; }
        
        .post-action-btn { position: absolute; right: 15px; bottom: 15px; background-color: var(--text-gray); color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .post-action-btn-large { flex: 1; background-color: var(--text-gray); color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; text-align: center; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .post-action-btn:hover, .post-action-btn-large:hover { background-color: #555555; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }

        .fab { position: fixed; bottom: 40px; right: 40px; width: 80px; height: 80px; background-color: #000; background-image: linear-gradient(white, white), linear-gradient(white, white); background-position: center; background-repeat: no-repeat; background-size: 40% 4px, 4px 40%; border-radius: 50%; color: transparent; font-size: 0; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s; z-index: 100; }
        .fab:hover { transform: scale(1.05); background-color: #333; }
        @media (max-width: 768px) {
            .navbar { padding: 0 15px; }
            .nav-actions { gap: 10px; }
            .nav-logo, .nav-icon, .nav-square { width: 32px; height: 32px; }
            .nav-badge { font-size: 12px; padding: 3px 6px; }
            
            .main-layout { flex-direction: column; }
            .sidebar { 
                width: 100%; height: auto; position: static; padding: 20px; 
                border-right: none; border-bottom: 1px solid #D0D0D0; gap: 15px;
            }
            .personal-sidebar-card { height: 80px; }
            
            .feed-content { padding: 20px; width: 100%; gap: 20px; }
            .post-card { flex-direction: column; gap: 15px; }
            .post-avatar { width: 50px; height: 50px; }
            .post-body { padding: 15px; }
            .fab { width: 60px; height: 60px; bottom: 20px; right: 20px; font-size: 35px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="navbar">
            <div class="nav-logo" onclick="window.location.href='first_page.html'"></div>
            <div class="nav-actions">
                <div class="nav-square" onclick="window.location.href='explore_page.html'"></div>
                <div class="nav-icon"></div>
                <div class="nav-badge" onclick="window.location.href='freq_page.html'">999+</div>
            </div>
        </div>

        <div class="main-layout">

            <div class="feed-content">
                <div class="post-card">
                    <div class="post-avatar"></div>
                    <div class="post-body">
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line long"></div>
                        <div style="display: flex; gap: 10px; margin-top: 20px;">
                            <button class="post-action-btn-large">編輯個人檔案</button>
                            <button class="post-action-btn-large"></button>
                        </div>
                    </div>
                </div>
                <div class="post-card">
                    <div class="post-avatar"></div>
                    <div style="display: flex; flex-direction: column; width: 100%;">
                        <div class="post-body">
                            <div class="skeleton-line short"></div>
                            <div class="skeleton-line long"></div>
                            <div class="skeleton-line long"></div>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <div style="width: 25px; height: 25px; background-color: #CCCCCC;"></div>
                            <div style="width: 25px; height: 25px; background-color: #CCCCCC;"></div>
                            <div style="width: 25px; height: 25px; background-color: #CCCCCC;"></div>
                        </div>
                    </div>
                </div>
                <div class="post-card">
                    <div class="post-avatar"></div>
                    <div class="post-body">
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line long"></div>
                    </div>
                </div>
            </div> 
        </div> 
        <div class="fab">+</div>
    </div> 
</body>
</html>
