<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人頁面</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=explore" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/intel-one-mono/index.css">

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        :root {
            --nav-bg: #8B6E5B;   
            --content-bg: #E0D8CC; 
            --card-bg: #FFFFFF;  
            --text-dark: #333333;
            --text-gray: #7A7A7A;
            --hover-bg: #E0E0E0; 
            --feed-bg: #F4EFEA;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--content-bg);
            font-family: 'Intel One Mono', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 400;
        }

        .app-container { width: 100%; display: flex; flex-direction: column; }

        .navbar { height: 60px; flex-shrink: 0; background-color: var(--nav-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 100; }
        .nav-logo { width: 40px; height: 40px; background-color: #000; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .nav-logo:hover { transform: scale(1.05); }
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .nav-icon { width: 40px; height: 40px; background-color: var(--card-bg); border-radius: 50%; cursor: pointer; }
        .nav-square { width: 40px; height: 40px; background-color: #4A3320; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; cursor: pointer; transition: transform 0.2s; }
        .nav-square:hover { transform: scale(1.05); }
        .nav-badge { background-color: var(--card-bg); color: #4A3320; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer; transition: transform 0.2s; }
        .nav-badge:hover { transform: scale(1.05); }

        .main-layout { display: flex; width: 100%; margin: 0; padding: 0; gap: 0; min-height: calc(100vh - 60px); }

        .sidebar { width: 380px; display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 60px; align-self: flex-start; height: calc(100vh - 60px); border-right: none; background-color: var(--content-bg); }

        .feed-content { flex: 1; display: flex; flex-direction: column; gap: 40px; padding: 40px 10%; padding-bottom: 80px; background-color: var(--feed-bg); box-sizing: border-box; max-width: 1200px; margin: 0 auto; min-height: calc(100vh - 60px); }

        .post-card { display: flex; gap: 25px; align-items: flex-start; }
        .post-avatar { width: 90px; height: 90px; background-color: var(--card-bg); border-radius: 50%; flex-shrink: 0; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.3s ease; }
        .post-avatar.black { background-color: #000; }
        .post-avatar:hover { transform: scale(1.05); }
        .post-body { background-color: var(--card-bg); width: 100%; min-width: 0; flex: 1; border-radius: 4px; padding: 30px; box-sizing: border-box; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1.5px solid #D8CFC4; transition: box-shadow 0.3s ease; }
        .post-body:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        
        .profile-btn { flex: 1; background-color: #DCD6CD; color: #4A3320; border: none; padding: 15px; font-size: 16px; font-weight: normal; letter-spacing: 1px; cursor: pointer; border-radius: 4px; text-align: center; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .profile-btn:hover { background-color: #C5BFB5; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }

        .fab { position: fixed; bottom: 40px; right: 40px; width: 80px; height: 80px; background-color: #4A3320; background-image: linear-gradient(white, white), linear-gradient(white, white); background-position: center; background-repeat: no-repeat; background-size: 40% 4px, 4px 40%; border-radius: 50%; color: transparent; font-size: 0; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.3s ease; z-index: 100; text-decoration: none; }
        .fab:hover { transform: scale(1.1) rotate(90deg); background-color: #331A00; }
        @media (max-width: 768px) {
            .navbar { padding: 0 15px; }
            .nav-actions { gap: 10px; }
            .nav-logo, .nav-icon, .nav-square { width: 32px; height: 32px; }
            .nav-badge { font-size: 12px; padding: 3px 6px; }
            
            .main-layout { flex-direction: column; }
            .sidebar { 
                width: 100%; height: auto; position: static; padding: 20px; 
                border-right: none; border-bottom: 1px solid #D0D0D0; gap: 15px;
            }
            .personal-sidebar-card { height: 80px; }
            
            .feed-content { padding: 20px; width: 100%; gap: 20px; }
            .post-card { flex-direction: column; gap: 15px; }
            .post-avatar { width: 50px; height: 50px; }
            .post-body { padding: 15px; }
            .fab { width: 60px; height: 60px; bottom: 20px; right: 20px; font-size: 35px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="navbar">
            <div class="nav-logo" onclick="window.location.href='first_page.html'"></div>
            <div class="nav-actions">
                <div class="nav-square" onclick="window.location.href='explore_page.html'">
                    <span class="material-symbols-outlined">explore</span>
                </div>
                <div class="nav-icon" style="background-color: white;"></div>
                <div class="nav-badge" onclick="window.location.href='freq_page.html'">999+</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
            </div>

            <div class="feed-content">
                <!-- Post 1: Profile details -->
                <div class="post-card">
                    <div class="post-avatar"></div>
                    <div class="post-body">
                        <div style="font-size: 20px; font-family: 'Intel One Mono', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 500; margin-bottom: 15px; color: #333;">@userid</div>
                        <div style="font-size: 16px; color: #333; line-height: 1.6; margin-bottom: 30px;">
                            個人簡介
                        </div>
                        <div style="display: flex; gap: 15px;">
                            <button class="profile-btn">編輯個人檔案</button>
                            <button class="profile-btn">編輯個人檔案</button>
                        </div>
                    </div>
                </div>

                <!-- Post 2: Private Text -->
                <div class="post-card">
                    <div class="post-avatar"></div>
                    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                        <div class="post-body">
                            <div style="font-size: 16px; color: #333; line-height: 1.6;">個人內容</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 6px; color: #7A7A7A;">
                            <div style="display: flex; gap: 15px;">
                                <div onclick="toggleEye(this)" style="cursor: pointer; display: flex; align-items: center;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </div>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            </div>
                            <div style="display: flex; gap: 15px;">
                                <svg onclick="toggleHeart(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                <svg onclick="toggleBookmark(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Post 3: Public Text -->
                <div class="post-card">
                    <div class="post-avatar"></div>
                    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                        <div class="post-body">
                            <div style="font-size: 16px; color: #333; line-height: 1.6;">發佈內容</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 6px; color: #7A7A7A;">
                            <div style="display: flex; gap: 15px;">
                                <div onclick="toggleEye(this)" style="cursor: pointer; display: flex; align-items: center;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </div>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            </div>
                            <div style="display: flex; gap: 15px;">
                                <svg onclick="toggleHeart(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                <svg onclick="toggleBookmark(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Post 4: Timer Post -->
                <div class="post-card">
                    <div class="post-avatar black"></div>
                    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                        <div class="post-body">
                            <div style="font-size: 32px; font-weight: bold; font-family: monospace; letter-spacing: 2px; margin-bottom: 20px;">02:00:58</div>
                            <div style="width: 100%; height: 250px; background-color: #A0A0A0; border-radius: 4px;"></div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 6px; color: #7A7A7A;">
                            <div style="display: flex; gap: 15px;">
                                <div onclick="toggleEye(this)" style="cursor: pointer; display: flex; align-items: center;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </div>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            </div>
                            <div style="display: flex; gap: 15px;">
                                <svg onclick="toggleHeart(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                <svg onclick="toggleBookmark(this)" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div> 
        </div> 
        <div class="fab"></div>
    </div> 

    <script>
        function toggleEye(element) {
            const isOpen = element.innerHTML.includes('<circle');
            if (isOpen) {
                // Change to closed eye with lashes
                element.innerHTML = '<path d="M3 10 C8 16, 16 16, 21 10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="8" y1="13" x2="6" y2="16"/><line x1="16" y1="13" x2="18" y2="16"/><line x1="10" y1="13.5" x2="9" y2="17"/><line x1="14" y1="13.5" x2="15" y2="17"/>';
            } else {
                // Change to open eye
                element.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function toggleHeart(element) {
            const isFilled = element.getAttribute('fill') === '#e74c3c';
            if (isFilled) {
                element.setAttribute('fill', 'none');
                element.setAttribute('stroke', 'currentColor');
                element.style.transform = "scale(1)";
            } else {
                element.setAttribute('fill', '#e74c3c');
                element.setAttribute('stroke', '#e74c3c');
                element.style.transform = "scale(1.1)";
            }
        }

        function toggleBookmark(element) {
            const isFilled = element.getAttribute('fill') === '#4A3320';
            if (isFilled) {
                element.setAttribute('fill', 'none');
                element.style.transform = "scale(1)";
            } else {
                element.setAttribute('fill', '#4A3320');
                element.style.transform = "scale(1.1)";
            }
        }
    </script>
</body>
</html>
