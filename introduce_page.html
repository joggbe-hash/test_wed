<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人介紹</title>
    <style>
        :root {
            --nav-bg: #8B6E5B;   
            --content-bg: #E0D8CC; 
            --card-bg: #FFFFFF;  
            --text-dark: #333333;
            --text-gray: #7A7A7A;
            --hover-bg: #E0E0E0; 
            --feed-bg: #F4EFEA;
            --primary-brown: #4A3320;
        }

        body {
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
            background-color: var(--content-bg);
        }

        /* 模擬模態視窗的深色半透明背景，可點擊 */
        .modal-backdrop {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(74, 51, 32, 0.4); 
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
            z-index: 1; 
            cursor: pointer;
        }

        /* 個人介紹卡片 */
        .profile-card {
            position: relative;
            z-index: 10;
            width: 340px;
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: modalPop 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes modalPop {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .profile-cover {
            width: 100%;
            height: 140px;
            background-color: var(--nav-bg);
            background-image: linear-gradient(45deg, #8B6E5B, #A68B7A);
        }

        .profile-avatar-container {
            display: flex;
            justify-content: center;
            margin-top: -50px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 6px solid var(--card-bg);
            background-color: #E8D354;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="15" fill="%23333"/><circle cx="50" cy="90" r="40" fill="%23333"/></svg>');
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .profile-info {
            text-align: center;
            padding: 10px 30px 30px;
            color: var(--text-dark);
        }

        .profile-username {
            font-size: 20px;
            font-weight: 600;
            margin: 15px 0 8px 0;
            letter-spacing: 1px;
        }

        .profile-link {
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
            color: var(--text-gray);
        }

        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #DCD6CD;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--primary-brown);
        }
        
        .action-btn:hover {
            background-color: #F4EFEA;
            border-color: var(--primary-brown);
            transform: translateY(-3px);
        }

        /* SVG 圖示 */
        .icon {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .expand-arrow {
            display: flex;
            justify-content: center;
            padding-top: 10px;
            cursor: pointer;
        }
        .expand-arrow svg {
            width: 28px;
            height: 28px;
            fill: var(--text-gray);
            transition: all 0.3s ease;
        }
        .expand-arrow:hover svg {
            transform: translateY(5px);
            fill: var(--primary-brown);
        }

    </style>
</head>
<body>

    <!-- 載入上一頁作為背景 -->
    <iframe id="bg-iframe" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; border: none; pointer-events: none;"></iframe>
    <script>
        const referrer = document.referrer;
        if (referrer && referrer.includes('html')) {
            document.getElementById('bg-iframe').src = referrer;
        } else {
            document.getElementById('bg-iframe').src = 'first_page.html';
        }
    </script>

    <!-- 點擊背景空白處返回上一頁 -->
    <div class="modal-backdrop" onclick="history.back()"></div>

    <!-- 個人介紹卡片 -->
    <div class="profile-card">
        <div class="profile-cover"></div>
        
        <div class="profile-avatar-container">
            <div class="profile-avatar"></div>
        </div>

        <div class="profile-info">
            <div class="profile-username">@哈哈</div>
            <div class="profile-link">
                <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
               haha.tww.com
            </div>

            <div class="profile-actions">
                <button class="action-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </button>
                <button class="action-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="16" y1="11" x2="22" y2="11"></line></svg>
                </button>
                <button class="action-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                </button>
            </div>
            
            <div class="expand-arrow" onclick="history.back()">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
        </div>
    </div>
</body>
</html>
