# Local Docker development overlay. Combine it with docker-compose.yaml; do not
# use this file in a deployed environment.
services:
  nginx:
    build:
      dockerfile: Type-WSP-deploy/nginx/Dockerfile.dev
    ports: !override
      - "8080:8080"
    environment:
      SERVER_NAME: localhost
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes: !override
      - ./nginx/templates/conf.d/default.dev.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/modsec/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./nginx/modsec/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
