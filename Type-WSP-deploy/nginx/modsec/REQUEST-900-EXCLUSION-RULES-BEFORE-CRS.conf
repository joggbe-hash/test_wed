# ======================================================
# 在 OWASP CRS 套用前執行的排除規則
# 用途:在 CRS 檢查之前先放行某些已知安全的場景
# 語法參考: https://coreruleset.org/docs/configuration/false_positives_tuning/
# ======================================================

# --- 放行健康檢查端點,不走 WAF ---
SecRule REQUEST_URI "@streq /healthz" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off"

# --- 媒體上傳端點:關閉會誤判二進位內容的規則 ---
# 920420 = Request content type not allowed
# 941100+ = XSS 規則 (對圖片/影片的 base64 會誤判)
# 942100+ = SQLi 規則 (對檔案內容常誤判)
SecRule REQUEST_URI "@beginsWith /api/upload" \
    "id:1001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveByTag=attack-xss,\
    ctl:ruleRemoveByTag=attack-sqli"

# --- 登入端點:關閉會擋密碼特殊字元的規則 ---
SecRule REQUEST_URI "@beginsWith /api/auth/login" \
    "id:1002,\
    phase:2,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:password,\
    ctl:ruleRemoveTargetById=942190;ARGS:password,\
    ctl:ruleRemoveTargetById=942200;ARGS:password,\
    ctl:ruleRemoveTargetById=942260;ARGS:password,\
    ctl:ruleRemoveTargetById=942270;ARGS:password,\
    ctl:ruleRemoveTargetById=942410;ARGS:password"
