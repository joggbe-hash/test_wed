services:

  # DMZ layer：唯一對外服務。Nginx/WAF 負責 HTTPS、SPA 靜態檔、API reverse proxy。
  nginx:
    build:
      context: ..
      dockerfile: Type-WSP-deploy/nginx/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    container_name: nginx-waf
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: ${API_PORT:?set API_PORT in .env}
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env}
      PORT: 8080
      SSL_PORT: 8443
      DOLLAR: $
      MODSEC_RULE_ENGINE: On
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_REQ_BODY_LIMIT: 26214400
      MODSEC_REQ_BODY_NOFILES_LIMIT: 131072
      PARANOIA: 1
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4
      BLOCKING_PARANOIA: 1
    volumes:
      - ./nginx/templates/conf.d/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/modsec/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./nginx/modsec/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
    networks:
      - web_net
      - app_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Application layer：Go API，處理登入、貼文、上傳、WebSocket。
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api-server
    expose:
      - "${API_PORT:?set API_PORT in .env}"
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PORT: ${API_PORT:?set API_PORT in .env}
      API_LISTEN_ADDR: ":${API_PORT:?set API_PORT in .env}"
      EXPOSE_VERIFICATION_CODE: ${EXPOSE_VERIFICATION_CODE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_SYSTEM: ${POSTGRES_DB_SYSTEM:?set POSTGRES_DB_SYSTEM in .env}
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:?set POSTGRES_DB_USER in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?set POSTGRES_SSLMODE in .env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env}
      MINIO_SECURE: ${MINIO_SECURE:?set MINIO_SECURE in .env}
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
    networks:
      - app_net
      - db_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${API_PORT}/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Redis 同時做 session store、驗證碼暫存、非同步工作佇列和 Pub/Sub 通知。
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis-queue
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Worker 消費 Redis task_queue，處理圖片與寄信任務，避免 API request 等太久。
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_SYSTEM: ${POSTGRES_DB_SYSTEM:?set POSTGRES_DB_SYSTEM in .env}
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:?set POSTGRES_DB_USER in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?set POSTGRES_SSLMODE in .env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env}
      MINIO_SECURE: ${MINIO_SECURE:?set MINIO_SECURE in .env}
    networks:
      - app_net
      - db_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  # Data layer：PostgreSQL 只在內部網路，外部不能直接連。
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_SYSTEM:?set POSTGRES_DB_SYSTEM in .env}
      POSTGRES_DB_SYSTEM: ${POSTGRES_DB_SYSTEM:?set POSTGRES_DB_SYSTEM in .env}
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:?set POSTGRES_DB_USER in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO 是 S3 相容物件儲存，保存 raw/ 原圖與 processed/ 處理後圖片。
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  web_net:
    name: web_net
    driver: bridge
  app_net:
    name: app_net
    driver: bridge
  db_net:
    name: db_net
    driver: bridge
    internal: true

volumes:
  redis_data:
  postgres_data:
  minio_data:
