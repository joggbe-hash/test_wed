<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入與註冊</title>
    <style>
        /* --- 基礎設定 --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        .auth-container {
            width: 100vw;  
            height: 100vh; 
            background-color: #FFFFFF;
            overflow: hidden; 
        }

        .form-slider {
            display: flex;
            width: 200%;  
            height: 100%; 
            transition: transform 0.4s ease-in-out; 
            transform: translateX(0); 
        }

        .form-section {
            width: 50%;  
            height: 100%; 
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
        }

        .input-group {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            border: 1px solid #CCCCCC;
        }

        .input-label {
            background-color: #888888;
            color: white;
            padding: 10px 20px;
            min-width: 100px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-field {
            flex-grow: 1;
            border: none;
            padding: 10px 15px;
            outline: none;
            font-size: 16px;
        }

        .btn {
            background-color: #888888;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: #666666; }

        .login-image-placeholder {
            width: 100%;
            max-width: 500px;
            height: 250px;
            background-color: #CCCCCC;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .shape-circle { width: 60px; height: 60px; background-color: #E0E0E0; border-radius: 50%; position: absolute; top: 40px; left: 80px; }
        .shape-triangle { width: 0; height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent; border-bottom: 120px solid #E0E0E0; position: absolute; bottom: 30px; left: 150px; }

        .forgot-password { width: 100%; max-width: 500px; text-align: right; margin-bottom: 20px; }
        .forgot-password a { color: #888888; text-decoration: none; font-size: 14px; background-color: #E0E0E0; padding: 5px 10px; }

        .login-actions { display: flex; gap: 20px; width: 100%; max-width: 500px; justify-content: space-between; }
        .login-actions .btn { flex: 1; }
        .register-submit-btn { margin-top: 20px; width: 100%; max-width: 300px; }
        @media (max-width: 768px) {
            .form-section { padding: 20px; width: 100vw; }
            .login-image-placeholder { height: 180px; }
            .input-label { min-width: 80px; padding: 10px; font-size: 14px; }
            .input-field { font-size: 14px; }
            .btn { width: 100%; padding: 10px; }
            .login-actions { flex-direction: column; gap: 10px; }
            .forgot-password { text-align: center; }
            .shape-circle { width: 40px; height: 40px; left: 50px; top: 30px; }
            .shape-triangle { border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 90px solid #E0E0E0; left: 100px; bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="form-slider" id="slider">
            
            <!-- 登入表單 -->
            <div id="loginForm" class="form-section">
                <div class="login-image-placeholder">
                    <div class="shape-circle"></div>
                    <div class="shape-triangle"></div>
                </div>

                <div class="input-group">
                    <div class="input-label">帳號</div>
                    <input type="text" class="input-field" placeholder="例如: s411322605">
                </div>

                <div class="input-group">
                    <div class="input-label">密碼</div>
                    <input type="password" class="input-field" placeholder="輸入密碼">
                </div>

                <div class="forgot-password"><a href="#">忘記密碼</a></div>

                <div class="login-actions">
                    <button class="btn" onclick="toggleForm('register')">註冊</button>
                    <!-- 點擊跳轉到 first_page.html -->
                    <button class="btn" onclick="window.location.href='first_page.html'">登入</button>
                </div>
            </div>

            <!-- 註冊表單 -->
            <div id="registerForm" class="form-section">
                <div class="input-group"><div class="input-label">輸入電子郵件</div><input type="email" class="input-field" placeholder="例如: joggbe@example.com"></div>
                <div class="input-group"><div class="input-label">輸入驗證碼</div><input type="text" class="input-field"></div>
                <div class="input-group"><div class="input-label">輸入密碼</div><input type="password" class="input-field"></div>
                <div class="input-group"><div class="input-label">再次輸入密碼</div><input type="password" class="input-field"></div>
                <div class="input-group"><div class="input-label">輸入使用者名稱</div><input type="text" class="input-field" placeholder="你的顯示名稱"></div>

                <!-- 點擊跳轉到 first_page.html -->
                <button class="btn register-submit-btn" onclick="window.location.href='first_page.html'">確認註冊</button>
                
                <div style="margin-top: 20px;">
                    <a href="#" style="color: #888888; text-decoration: none;" onclick="toggleForm('login')">返回登入</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleForm(target) {
            const slider = document.getElementById('slider');
            if (target === 'register') {
                slider.style.transform = 'translateX(-50%)';
            } else {
                slider.style.transform = 'translateX(0)';
            }
        }
    </script>

</body>
</html>
